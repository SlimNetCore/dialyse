version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: hemodialyse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hemodialyse
      POSTGRES_USER: hemo_user
      POSTGRES_PASSWORD: hemo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

