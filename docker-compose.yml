version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: hemodialyse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hemodialyse
      POSTGRES_USER: hemo_user
      POSTGRES_PASSWORD: hemo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Migrations Flyway (one-shot) : docker compose run --rm flyway [migrate|info|validate]
  flyway:
    image: flyway/flyway:11-alpine
    restart: "no"
    command: migrate
    depends_on:
      - postgres
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/hemodialyse
      FLYWAY_USER: hemo_user
      FLYWAY_PASSWORD: hemo_pass
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
      FLYWAY_CONNECT_RETRIES: "20"
    volumes:
      - ./backend/platform/src/main/resources/db/migration:/flyway/sql:ro

  redis:
    image: redis:7-alpine
    container_name: hemodialyse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

