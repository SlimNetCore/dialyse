# ============================================================
# GitLab CI — Hemodialyse
# Nécessite un GitLab Runner configuré (Docker executor recommandé)
# ============================================================

stages:
  - build
  - test
  - scan
  - docker
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dmaven.artifact.threads=4"
  MAVEN_CLI_OPTS: "--batch-mode --quiet"
  NODE_ENV: "production"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY_IMAGE_BACKEND: $CI_REGISTRY_IMAGE/backend
  REGISTRY_IMAGE_FRONTEND: $CI_REGISTRY_IMAGE/frontend

# Cache des dépendances partagé entre les jobs
cache:
  key:
    files:
      - backend/pom.xml
      - frontend/package-lock.json
  paths:
    - .m2/repository
    - frontend/node_modules/
  policy: pull-push

# ============================================================
# Stage BUILD
# ============================================================

build:backend:
  stage: build
  image: maven:3.9-eclipse-temurin-21-alpine
  script:
    - cd backend
    - mvn $MAVEN_CLI_OPTS clean compile
  artifacts:
    paths:
      - backend/target/classes/
    expire_in: 1 hour
  only:
    - merge_requests
    - main
    - develop

build:frontend:
  stage: build
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci --prefer-offline --no-audit
    - npm run build -- --configuration production
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day
  only:
    - merge_requests
    - main
    - develop

# ============================================================
# Stage TEST
# ============================================================

test:backend:
  stage: test
  image: maven:3.9-eclipse-temurin-21-alpine
  needs: [ "build:backend" ]
  script:
    - cd backend
    - mvn $MAVEN_CLI_OPTS verify
  artifacts:
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
    paths:
      - backend/target/site/jacoco/
    expire_in: 7 days
    when: always
  coverage: '/Total.*?([0-9]{1,3})%/'
  only:
    - merge_requests
    - main
    - develop

test:frontend:
  stage: test
  image: node:22-alpine
  needs: [ "build:frontend" ]
  script:
    - cd frontend
    - npm test -- --watch=false --reporter=verbose
  artifacts:
    reports:
      junit: frontend/test-results/*.xml
    paths:
      - frontend/coverage/
    expire_in: 7 days
    when: always
  only:
    - merge_requests
    - main
    - develop

# ============================================================
# Stage SCAN — SonarQube (optionnel)
# ============================================================

scan:sonar:
  stage: scan
  image: maven:3.9-eclipse-temurin-21-alpine
  needs: [ "test:backend", "test:frontend" ]
  script:
    - cd backend
    - mvn $MAVEN_CLI_OPTS sonar:sonar
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true
  allow_failure: true
  only:
    - main
    - develop
  rules:
    - if: '$SONAR_HOST_URL != null && $SONAR_TOKEN != null'

# ============================================================
# Stage DOCKER — Build & Push images
# ============================================================

.docker_build_template: &docker_build
  stage: docker
  image: docker:26
  services:
    - docker:26-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  only:
    - main
    - develop

docker:backend:
  <<: *docker_build
  needs: [ "test:backend" ]
  script:
    - |
      docker build \
        --cache-from $REGISTRY_IMAGE_BACKEND:latest \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t $REGISTRY_IMAGE_BACKEND:$CI_COMMIT_SHORT_SHA \
        -t $REGISTRY_IMAGE_BACKEND:$CI_COMMIT_REF_SLUG \
        -t $REGISTRY_IMAGE_BACKEND:latest \
        ./backend
    - docker push $REGISTRY_IMAGE_BACKEND:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_IMAGE_BACKEND:$CI_COMMIT_REF_SLUG
    - docker push $REGISTRY_IMAGE_BACKEND:latest

docker:frontend:
  <<: *docker_build
  needs: [ "test:frontend" ]
  script:
    - |
      docker build \
        --cache-from $REGISTRY_IMAGE_FRONTEND:latest \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t $REGISTRY_IMAGE_FRONTEND:$CI_COMMIT_SHORT_SHA \
        -t $REGISTRY_IMAGE_FRONTEND:$CI_COMMIT_REF_SLUG \
        -t $REGISTRY_IMAGE_FRONTEND:latest \
        ./frontend
    - docker push $REGISTRY_IMAGE_FRONTEND:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_IMAGE_FRONTEND:$CI_COMMIT_REF_SLUG
    - docker push $REGISTRY_IMAGE_FRONTEND:latest

# ============================================================
# Stage DEPLOY — Déploiement en production (manuel sur main)
# ============================================================

deploy:production:
  stage: deploy
  image: alpine:latest
  needs: [ "docker:backend", "docker:frontend" ]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        cd $DEPLOY_PATH &&
        export REGISTRY_IMAGE_BACKEND=$REGISTRY_IMAGE_BACKEND &&
        export REGISTRY_IMAGE_FRONTEND=$REGISTRY_IMAGE_FRONTEND &&
        export IMAGE_TAG=$CI_COMMIT_SHORT_SHA &&
        docker-compose --profile full pull &&
        docker-compose --profile full up -d --remove-orphans
      "
  environment:
    name: production
    url: https://hemodialyse.example.com
  when: manual
  only:
    - main

