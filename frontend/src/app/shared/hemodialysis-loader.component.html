<div [class.overlay]="mode === 'overlay'" aria-live="polite" class="loader-shell" role="status">
  @if (showServerUnavailableIcon) {
    <div aria-hidden="true" class="server-unavailable-visual">
      <svg class="kidney-crying-svg" viewBox="0 0 130 140" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient [attr.id]="alertGradientId" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="var(--hemo-loader-alert-top)"/>
            <stop offset="52%" stop-color="var(--hemo-loader-alert-mid)"/>
            <stop offset="100%" stop-color="var(--hemo-loader-alert-bottom)"/>
          </linearGradient>
          <linearGradient [attr.id]="tearGradientId" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="var(--hemo-loader-tear-top)"/>
            <stop offset="100%" stop-color="var(--hemo-loader-tear-bottom)"/>
          </linearGradient>
        </defs>

        <path
          [attr.fill]="'url(#' + alertGradientId + ')'"
          d="M38 22
             C20 22 10 36 10 54
             C10 78 22 92 36 100
             C40 103 43 108 43 114 L43 120
             L87 120 L87 114
             C87 108 90 103 94 100
             C108 92 120 78 120 54
             C120 36 110 22 92 22
             C82 22 73 27 65 35
             C57 27 48 22 38 22 Z"
          class="kidney-crying-body"/>

        <ellipse class="kidney-crying-highlight" cx="60" cy="52" rx="28" ry="18"/>

        <ellipse class="kidney-eye" cx="48" cy="62" rx="8" ry="9"/>
        <circle class="kidney-pupil" cx="49.5" cy="64" r="4.2"/>
        <circle class="kidney-eye-gloss" cx="51" cy="62" r="1.4"/>

        <ellipse class="kidney-eye" cx="82" cy="62" rx="8" ry="9"/>
        <circle class="kidney-pupil" cx="83.5" cy="64" r="4.2"/>
        <circle class="kidney-eye-gloss" cx="85" cy="62" r="1.4"/>

        <path class="kidney-brow" d="M39 50 Q48 44 56 48"/>
        <path class="kidney-brow" d="M74 48 Q82 44 91 50"/>
        <path class="kidney-mouth" d="M50 84 Q65 78 80 84"/>

        <path [attr.fill]="'url(#' + tearGradientId + ')'" class="tear-l" d="M46 72 Q44 81 47 88 Q50 81 48 72 Z"/>
        <path [attr.fill]="'url(#' + tearGradientId + ')'" class="tear-r" d="M80 72 Q78 81 81 88 Q84 81 82 72 Z"/>
      </svg>
    </div>
  } @else {
    <div [class.is-reconnecting]="showReconnectingKidney" [class.is-reduced-motion]="reducedMotion()" aria-hidden="true"
         class="circuit-visual">
      <svg
        class="circuit-svg"
        viewBox="0 0 120 120"
        xmlns="http://www.w3.org/2000/svg"
        [attr.aria-label]="label | translate"
        [attr.height]="visualSize()"
        [attr.width]="visualSize()"
        role="img"
      >
        <defs>
          <linearGradient [attr.id]="circuitGradientId" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="var(--hemo-loader-veineux)"/>
            <stop offset="55%" stop-color="var(--hemo-loader-arteriel)"/>
            <stop offset="100%" stop-color="var(--hemo-loader-veineux-soft)"/>
          </linearGradient>
          <filter [attr.id]="circuitGlowId" height="170%" width="170%" x="-35%" y="-35%">
            <feDropShadow dx="0" dy="10" flood-color="var(--hemo-loader-shadow)" flood-opacity="0.28" stdDeviation="8"/>
          </filter>
        </defs>

        <circle class="circuit-halo" cx="60" cy="60" r="54"/>
        <circle class="circuit-track" cx="60" cy="60" r="50"/>
        <circle class="circuit-track-soft" cx="60" cy="60" r="42"/>
        <circle class="circuit-flow circuit-flow--arterial" cx="60" cy="60" r="50"/>
        <circle class="circuit-flow circuit-flow--venous" cx="60" cy="60" r="50"/>

        <g [attr.filter]="'url(#' + circuitGlowId + ')'" class="dialyzer-assembly">
          <rect class="dialyzer-body" height="16" rx="4" width="26" x="47" y="3"/>
          <rect class="dialyzer-core" height="9" rx="2.5" width="14" x="53" y="6.5"/>
          <path class="dialyzer-channel" d="M49.5 11 H70.5"/>
          <path class="dialyzer-line" d="M54 22 V30"/>
          <path class="dialyzer-line" d="M66 22 V30"/>
        </g>

        <circle class="circuit-core" cx="60" cy="60" r="16"/>
        <circle class="circuit-core-pulse" cx="60" cy="60" r="21"/>

        @if (reducedMotion()) {
          <circle class="circuit-dot circuit-dot--static circuit-dot--arterial" cx="60" cy="10" r="5.4"/>
          <circle class="circuit-dot circuit-dot--static circuit-dot--arterial" cx="105" cy="85" r="5.4"/>
          <circle class="circuit-dot circuit-dot--static circuit-dot--venous" cx="15" cy="85" r="5.4"/>
        } @else {
          @for (dot of dots(); track dot.id) {
            <g [attr.transform]="'rotate(' + dot.angle + ' 60 60)'">
              <g [class.circuit-dot-orbit--arterial]="dot.kind === 'arterial'" [class.circuit-dot-orbit--venous]="dot.kind === 'venous'"
                 class="circuit-dot-orbit">
                <animateTransform
                  [attr.dur]="speed + 's'"
                  attributeName="transform"
                  from="0 60 60"
                  repeatCount="indefinite"
                  to="360 60 60"
                  type="rotate"
                />
                <circle [attr.cx]="60" [attr.cy]="10" [attr.fill]="dot.color" [attr.r]="dot.radius"
                        class="circuit-dot"/>
                <circle [attr.cx]="58.3" [attr.cy]="8.2" [attr.r]="dot.radius * 0.34" class="circuit-dot-highlight"/>
              </g>
            </g>
          }
        }
      </svg>

      @if (showReconnectingKidney) {
        <span class="reconnect-counter">{{ reconnectSeconds() }}s</span>
      }
    </div>
  }

  <p [class.server-unavailable-text]="showServerUnavailableIcon" class="loader-text">{{ label | translate }}</p>
  @if (showReconnectingKidney) {
    <p class="loader-reconnect-meta">{{ 'COMMON.RECONNECTING_SINCE' | translate:{seconds: reconnectSeconds()} }}</p>
  }
</div>
