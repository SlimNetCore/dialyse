<div [class.overlay]="mode === 'overlay'" aria-live="polite" class="loader-shell" role="status">
  @if (showServerUnavailableIcon) {
    <!-- Rein cartoon qui pleure : contours épais, sourcils froncés, larme animée -->
    <div aria-hidden="true" class="server-unavailable-visual">
      <svg class="kidney-crying-svg" viewBox="0 0 130 140" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="kgA" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#fda4af"/>
            <stop offset="50%" stop-color="#f43f5e"/>
            <stop offset="100%" stop-color="#9f1239"/>
          </linearGradient>
          <linearGradient id="kgB" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#e0f2fe"/>
            <stop offset="100%" stop-color="#0ea5e9"/>
          </linearGradient>
          <!-- Ombre douce sous le rein -->
          <filter height="140%" id="softShadow" width="140%" x="-20%" y="-10%">
            <feDropShadow dx="0" dy="4" flood-color="#9f1239" flood-opacity="0.22" stdDeviation="5"/>
          </filter>
        </defs>

        <!-- Corps du rein (forme anatomo-cartoon) -->
        <path
          d="M38 22
             C20 22 10 36 10 54
             C10 78 22 92 36 100
             C40 103 43 108 43 114 L43 120
             L87 120 L87 114
             C87 108 90 103 94 100
             C108 92 120 78 120 54
             C120 36 110 22 92 22
             C82 22 73 27 65 35
             C57 27 48 22 38 22 Z"
          fill="url(#kgA)"
          filter="url(#softShadow)"
          stroke="#7f1d1d"
          stroke-linejoin="round"
          stroke-width="4"/>

        <!-- Highlight interne doux -->
        <ellipse cx="60" cy="52" fill="rgba(255,255,255,0.18)" rx="28" ry="18"/>

        <!-- Œil gauche (blanc + pupille) -->
        <ellipse cx="48" cy="62" fill="#ffffff" rx="8" ry="9" stroke="#7f1d1d" stroke-width="2.5"/>
        <circle cx="49.5" cy="64" fill="#1e293b" r="4.2"/>
        <circle cx="51" cy="62" fill="white" r="1.4"/>

        <!-- Œil droit -->
        <ellipse cx="82" cy="62" fill="#ffffff" rx="8" ry="9" stroke="#7f1d1d" stroke-width="2.5"/>
        <circle cx="83.5" cy="64" fill="#1e293b" r="4.2"/>
        <circle cx="85" cy="62" fill="white" r="1.4"/>

        <!-- Sourcil gauche (froncé, épais) -->
        <path d="M39 50 Q48 44 56 48" fill="none" stroke="#7f1d1d" stroke-linecap="round" stroke-width="3.5"/>
        <!-- Sourcil droit (froncé, épais) -->
        <path d="M74 48 Q82 44 91 50" fill="none" stroke="#7f1d1d" stroke-linecap="round" stroke-width="3.5"/>

        <!-- Bouche triste (arc vers le bas) -->
        <path d="M50 84 Q65 78 80 84" fill="none" stroke="#7f1d1d" stroke-linecap="round" stroke-width="3"/>

        <!-- Larme gauche animée -->
        <path class="tear-l" d="M46 72 Q44 81 47 88 Q50 81 48 72 Z" fill="url(#kgB)" stroke="#38bdf8"
              stroke-width="1.5"/>
        <!-- Larme droite animée (décalée) -->
        <path class="tear-r" d="M80 72 Q78 81 81 88 Q84 81 82 72 Z" fill="url(#kgB)" stroke="#38bdf8"
              stroke-width="1.5"/>
      </svg>
    </div>
  } @else {
    <div aria-hidden="true" class="loader-visual">
      <span class="loader-ring"></span>
      <span class="loader-core">
        <mat-icon>monitor_heart</mat-icon>
      </span>
      <span class="loader-pulse"></span>
    </div>
  }
  <p [class.server-unavailable-text]="showServerUnavailableIcon" class="loader-text">{{ label | translate }}</p>
</div>
