<section class="list-panel">
  <div class="list-actions">
    <button (click)="clearAllFilters()" [disabled]="!hasColumns()" mat-stroked-button type="button">
      <mat-icon>filter_alt_off</mat-icon>
      {{ 'PATIENT_LIST.RESET_FILTERS_BUTTON' | translate }}
    </button>
  </div>

  <div class="table-wrap">
    <table [dataSource]="displayedRows()" [style.min-width.px]="minTableWidthPx()" class="shared-table" mat-table>
      @for (column of columns(); track trackByColumn($index, column)) {
        <ng-container [matColumnDef]="column.id">
          <th *matHeaderCellDef [style.max-width.px]="column.maxWidthPx ?? null"
              [style.min-width.px]="column.minWidthPx ?? null" [style.width.px]="columnWidthPx(column)" mat-header-cell>
            <div class="th-wrap">
              <button
                (click)="onHeaderSort(column)"
                [attr.aria-label]="currentSortAriaLabel(column) | translate"
                [disabled]="!column.sortable"
                class="header-button"
                type="button"
              >
                <span class="header-label">{{ column.headerKey | translate }}</span>
                @if (column.sortable) {
                  <mat-icon class="sort-icon">{{ currentSortIcon(column) }}</mat-icon>
                }
              </button>

              @if (column.filter; as filter) {
                <button
                  [attr.aria-label]="'COMMON.FILTER_BY' | translate: { field: (column.headerKey | translate) }"
                  [class.filter-active]="isFilterActive(column.id)"
                  [matMenuTriggerFor]="menu"
                  class="filter-button"
                  mat-icon-button
                  type="button"
                >
                  <mat-icon>{{ isFilterActive(column.id) ? 'filter_alt' : 'filter_alt_off' }}</mat-icon>
                </button>

                <mat-menu #menu="matMenu" class="th-filter">
                  <div (click)="$event.stopPropagation()" class="menu-body">
                    @if (filter.component) {
                      <app-dynamic-filter-host
                        (clear)="clearFilter(column.id)"
                        (valueChange)="onFilterValue(column.id, $event)"
                        [componentInputs]="filter.componentInputs ?? {}"
                        [component]="filter.component"
                        [value]="currentFilterValue(column.id)"
                      />
                    } @else {
                      <app-column-filter-renderer
                        (clear)="clearFilter(column.id)"
                        (valueChange)="onFilterValue(column.id, $event)"
                        [labelKey]="filter.labelKey ?? column.headerKey"
                        [options]="filter.options ?? []"
                        [placeholder]="filter.placeholder ?? ''"
                        [type]="filter.type ?? 'text'"
                        [value]="currentFilterValue(column.id)"
                      />
                    }
                  </div>
                </mat-menu>
              }

              @if (column.resizable) {
                <span (mousedown)="onResizeStart($event, column)" class="resize-handle"></span>
              }
            </div>
          </th>

          <td *matCellDef="let row" [style.max-width.px]="column.maxWidthPx ?? null"
              [style.min-width.px]="column.minWidthPx ?? null" [style.width.px]="columnWidthPx(column)" mat-cell>
            @if (column.cellTemplate) {
              <ng-container
                *ngTemplateOutlet="
                  column.cellTemplate;
                  context: { $implicit: row, row: row, value: cellValue(row, column), column: column }
                "
              />
            } @else {
              {{ cellValue(row, column) }}
            }
          </td>
        </ng-container>
      }

      <tr *matHeaderRowDef="displayedColumnIds()" mat-header-row></tr>
      <tr
        (click)="onRowClick(row)"
        *matRowDef="let row; columns: displayedColumnIds()"
        class="data-row"
        mat-row
      ></tr>
      <tr *matNoDataRow class="mat-mdc-row">
        <td [attr.colspan]="displayedColumnIds().length || 1" class="mat-mdc-cell no-data-cell">
          {{ emptyLabelKey() | translate }}
        </td>
      </tr>
    </table>
  </div>
</section>
