<mat-card class="form-card">
  <h2>
    <mat-icon>{{ isEdit() ? 'edit' : 'add' }}</mat-icon>
    {{ isEdit() ? 'Modifier' : 'Créer' }} un rôle
  </h2>

  <form [formRoot]="roleForm">
    <div class="grid">
      <mat-form-field appearance="outline">
        <mat-label>Code</mat-label>
        <input [formField]="roleForm.code" matInput/>
        <mat-icon matPrefix>code</mat-icon>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Nom</mat-label>
        <input [formField]="roleForm.name" matInput/>
        <mat-icon matPrefix>label</mat-icon>
      </mat-form-field>
    </div>
    <mat-form-field appearance="outline" class="full">
      <mat-label>Description</mat-label>
      <textarea [formField]="roleForm.description" matInput rows="3"></textarea>
    </mat-form-field>

    <div class="actions">
      <button mat-stroked-button routerLink="/admin/roles">
        <mat-icon>arrow_back</mat-icon>
        Retour
      </button>
      <button (click)="save()" color="primary" mat-flat-button type="button">
        <mat-icon>save</mat-icon>
        Enregistrer
      </button>
    </div>
  </form>
</mat-card>
