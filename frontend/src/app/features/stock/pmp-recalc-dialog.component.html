<h2 mat-dialog-title>
  <mat-icon>sync</mat-icon>
  {{ 'STOCK.PMP_RECALC.TITLE' | translate }}
</h2>

<mat-dialog-content>
  <p class="note">{{ 'STOCK.PMP_RECALC.NOTE' | translate }}</p>

  <div class="row">
    <span>{{ 'STOCK.PMP_RECALC.STATUS_LABEL' | translate }}</span>
    <strong>{{ status() }}</strong>
  </div>
  <div class="row">
    <span>{{ 'STOCK.PMP_RECALC.PROGRESS_LABEL' | translate }}</span>
    <strong>{{ processed() }} / {{ total() }}</strong>
  </div>

  <mat-progress-bar
    [value]="progressPercent()"
    mode="determinate"
  ></mat-progress-bar>

  <p class="message">{{ message() }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button (click)="close()" mat-stroked-button>{{ 'STOCK.PMP_RECALC.CLOSE' | translate }}</button>
</mat-dialog-actions>
