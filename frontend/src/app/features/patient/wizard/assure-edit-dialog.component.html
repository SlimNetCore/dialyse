<h2 mat-dialog-title style="display:flex;align-items:center;gap:8px">
  <mat-icon>edit</mat-icon>
  Modifier l'assuré
</h2>
<mat-dialog-content class="assure-edit-dialog-content">
  <div class="wizard-form">
    <mat-form-field appearance="outline" style="width:100%;margin-bottom:4px">
      <mat-label>N° Assurance</mat-label>
      <mat-icon matPrefix>badge</mat-icon>
      <input [value]="data.numeroAssurance" disabled matInput/>
    </mat-form-field>
    <div style="display:flex;gap:10px;margin-bottom:4px">
      <div style="flex:1">
        <mat-form-field appearance="outline" style="width:100%">
          <mat-label>Nom *</mat-label>
          <mat-icon matPrefix>person</mat-icon>
          <input
            (blur)="form.markTouched('nom')"
            (input)="onText('nom', $any($event.target).value)"
            [value]="form.value().nom"
            matInput
          />
        </mat-form-field>
        @if (form.showError('nom')) {
          <div class="field-error">Obligatoire</div>
        }
      </div>
      <div style="flex:1">
        <mat-form-field appearance="outline" style="width:100%">
          <mat-label>Prénom *</mat-label>
          <mat-icon matPrefix>person_outline</mat-icon>
          <input
            (blur)="form.markTouched('prenom')"
            (input)="onText('prenom', $any($event.target).value)"
            [value]="form.value().prenom"
            matInput
          />
        </mat-form-field>
        @if (form.showError('prenom')) {
          <div class="field-error">Obligatoire</div>
        }
      </div>
      <app-searchable-select
        (selectionChanged)="onSelect('sexe', $event)"
        [items]="sexeOptions"
        [label]="'Sexe'"
        [prefixIcon]="'wc'"
        [selectedId]="form.value().sexe"
        cssClass="dialog-flex"
      />
    </div>
    <div style="display:flex;gap:10px;margin-bottom:4px">
      <mat-form-field appearance="outline" style="flex:1">
        <mat-label>Date de naissance</mat-label>
        <mat-icon matPrefix>cake</mat-icon>
        <input
          (dateChange)="onDate($event.value)"
          [matDatepicker]="dpDN"
          [value]="form.value().dateNaissance"
          matInput
        />
        <mat-datepicker-toggle [for]="dpDN" matSuffix/>
        <mat-datepicker #dpDN/>
      </mat-form-field>
      <app-searchable-select
        (selectionChanged)="onSelect('groupeSanguin', $event)"
        [items]="groupeSanguinOptions"
        [label]="'Groupe sanguin'"
        [prefixIcon]="'bloodtype'"
        [selectedId]="form.value().groupeSanguin"
        cssClass="dialog-flex"
      />
    </div>
    <div style="display:flex;gap:10px;margin-bottom:4px">
      <mat-form-field appearance="outline" style="flex:1">
        <mat-label>Tél. personnel</mat-label>
        <mat-icon matPrefix>phone</mat-icon>
        <input
          (input)="onText('telPersonnel', $any($event.target).value)"
          [value]="form.value().telPersonnel"
          matInput
        />
      </mat-form-field>
      <mat-form-field appearance="outline" style="flex:1">
        <mat-label>Tél. mobile</mat-label>
        <mat-icon matPrefix>phone_iphone</mat-icon>
        <input
          (input)="onText('telMobile', $any($event.target).value)"
          [value]="form.value().telMobile"
          matInput
        />
      </mat-form-field>
      <mat-form-field appearance="outline" style="flex:1">
        <mat-label>Tél. bureau</mat-label>
        <mat-icon matPrefix>phone_in_talk</mat-icon>
        <input
          (input)="onText('telBureau', $any($event.target).value)"
          [value]="form.value().telBureau"
          matInput
        />
      </mat-form-field>
    </div>
    <mat-form-field appearance="outline" style="width:100%">
      <mat-label>Adresse</mat-label>
      <mat-icon matPrefix>home</mat-icon>
      <input
        (input)="onText('adresse', $any($event.target).value)"
        [value]="form.value().adresse"
        matInput
      />
    </mat-form-field>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end" style="gap:8px;padding:12px">
  <button (click)="cancel()" mat-stroked-button type="button">
    <mat-icon>close</mat-icon>
    Annuler
  </button>
  <button
    (click)="save()"
    [disabled]="form.invalid()"
    color="primary"
    mat-flat-button
    type="button"
  >
    <mat-icon>save</mat-icon>
    Enregistrer
  </button>
</mat-dialog-actions>
