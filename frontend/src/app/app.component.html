@if (showStartupLoader() || showConnectionLoader()) {
  <div class="auth-loader-backdrop">
    <app-hemodialysis-loader
      [label]="startupLoaderLabel()"
      [showServerUnavailableIcon]="startupServerUnavailable() || showConnectionLoader()"
      mode="overlay">
    </app-hemodialysis-loader>
  </div>
} @else {
  <router-outlet></router-outlet>
}
