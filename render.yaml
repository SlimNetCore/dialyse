services:
  - type: web
    name: hemodialyse-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      - key: CORS_ORIGINS
        value: "https://dialysis-beta.vercel.app,https://dialyse.onrender.com,http://localhost:4200"
      - key: CORS_ORIGIN_PATTERNS
        value: "https://*.vercel.app"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: "None"
      - key: JWT_SECRET
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DRIVER
        value: "org.postgresql.Driver"
      - key: CACHE_TTL_REFERENTIALS
        value: "PT6H"
      - key: CACHE_TTL_PATIENT_DETAIL
        value: "PT15M"
      - key: CACHE_TTL_PATIENT_LIST
        value: "PT3M"
      - key: CACHE_TTL_PATIENT_COUNT
        value: "PT3M"

