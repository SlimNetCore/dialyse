services:
  - type: web
    name: hemodialyse-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      - key: CORS_ORIGINS
        value: "https://your-frontend-domain.example"
      - key: JWT_SECRET
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DRIVER
        value: "org.postgresql.Driver"
      - key: CACHE_TTL_REFERENTIALS
        value: "PT6H"
      - key: CACHE_TTL_PATIENT_DETAIL
        value: "PT15M"
      - key: CACHE_TTL_PATIENT_LIST
        value: "PT3M"
      - key: CACHE_TTL_PATIENT_COUNT
        value: "PT3M"

