spring:
  application:
    name: hemodialyse-backend
  datasource:
    # Default to in-memory H2 for local development; override with DB_URL env var for other environments
    url: ${DB_URL:jdbc:h2:mem:hemodialyse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: always
      data-locations: classpath:db/seed.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    time-zone: UTC

jakarta.persistence.jdbc.url: ${DB_URL:jdbc:h2:mem:hemodialyse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-123456}
    auth:
      demo-user: ${APP_DEMO_USER:admin}
      demo-password: ${APP_DEMO_PASSWORD:admin123}
