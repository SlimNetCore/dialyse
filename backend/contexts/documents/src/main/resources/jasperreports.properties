# Polices des documents PDF (POL1, ADR 0208 ; option A de l'ADR 0162).
# Aucun gabarit ne declare de fontName : la police par defaut s'applique a tous. DejaVu Sans vient de net.sf.jasperreports:jasperreports-fonts,
# dont la famille est deja declaree Identity-H + embarquee ; les proprietes pdf ci-dessous couvrent aussi les polices non declarees en famille.
net.sf.jasperreports.default.font.name=DejaVu Sans
net.sf.jasperreports.default.pdf.font.name=DejaVu Sans
net.sf.jasperreports.default.pdf.encoding=Identity-H
net.sf.jasperreports.default.pdf.embedded=true
