# Valeurs par defaut du contexte GMAO (precedence basse : toute valeur de application*.yml les remplace).
# Registre de publication Spring Modulith (ADR 0013) : les publications terminees sont supprimees, les incompletes rejouees au demarrage.
spring.modulith.events.completion-mode=delete
spring.modulith.events.republish-outstanding-events-on-restart=true
# Table event_publication : creee par la migration Flyway V35 en production ; l'initialiseur Modulith (CREATE TABLE IF NOT EXISTS,
# idempotent) la cree pour les bases locales/tests H2. Passer a false une fois Flyway applique partout.
spring.modulith.events.jdbc.schema-initialization.enabled=true
# Seuil de reforme (RG-GMA-062, KB-GMAO-05) : ratio maintenance cumulee / prix d acquisition, un seul pour toute l application.
hemodialyse.gmao.reforme-seuil-ratio=0.60
