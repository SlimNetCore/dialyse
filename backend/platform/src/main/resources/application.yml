spring:
  application:
    name: hemodialyse-backend
  datasource:
    # Default to in-memory H2 for local development; override with DB_URL env var for other environments
    url: ${DB_URL:jdbc:h2:mem:hemodialyse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    time-zone: UTC
  cache:
    type: caffeine

jakarta.persistence.jdbc.url: ${DB_URL:jdbc:h2:mem:hemodialyse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cache:
    ttl:
      referentials: ${CACHE_TTL_REFERENTIALS:PT6H}
      patient-detail: ${CACHE_TTL_PATIENT_DETAIL:PT15M}
      patient-list: ${CACHE_TTL_PATIENT_LIST:PT3M}
      patient-count: ${CACHE_TTL_PATIENT_COUNT:PT3M}
  cors:
    allowed-origins: ${CORS_ORIGINS:https://dialyse.onrender.com,https://dialysis-beta.vercel.app,http://localhost:4200}
    allowed-origin-patterns: ${CORS_ORIGIN_PATTERNS:}
  auth:
    cookie:
      name: ${AUTH_COOKIE_NAME:HEMO_AUTH}
      refresh-name: ${AUTH_REFRESH_COOKIE_NAME:HEMO_REFRESH}
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      path: ${AUTH_COOKIE_PATH:/}
      refresh-path: ${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth/refresh}
      domain: ${AUTH_COOKIE_DOMAIN:}
  reports:
    base-dir: ${REPORTS_DIR:}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-123456}
    expiration: ${JWT_EXPIRATION:28800}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  stock:
    demo-data: ${STOCK_DEMO_DATA:true}

