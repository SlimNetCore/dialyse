spring:
  application:
    name: hemodialyse-backend
  datasource:
    # Default to in-memory H2 for local development; override with DB_URL env var for other environments
    url: ${DB_URL:jdbc:h2:mem:hemodialyse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  sql:
    init:
      mode: always
      # DDL H2 par contexte propriétaire (S-DDL3 / S-DDL3b, ADR 0186 et 0187) : un script par contexte
      # (contexts/<contexte>/src/main/resources/db/h2/), db/schema.sql ne garde que l'identité, l'audit, la reprise et l'outbox
      # (plateforme). Deux dépendances d'ordre, seules : organisation AVANT db/schema.sql (app_user_center -> centers, clé étrangère) et
      # organisation AVANT planification (la reprise des salles d'isolement lit planning_parametres et écrit salle). Le reste est sans effet,
      # vérifié par SchemaH2DesScriptsParContexteTest.
      schema-locations: >-
        classpath:db/h2/organisation-schema.sql,
        classpath:db/schema.sql,
        classpath:db/h2/comptabilite-schema.sql,
        classpath:db/h2/documents-schema.sql,
        classpath:db/h2/notifications-schema.sql,
        classpath:db/h2/absences-patients-schema.sql,
        classpath:db/h2/planification-schema.sql,
        classpath:db/h2/stock-schema.sql,
        classpath:db/h2/patient-couverture-schema.sql,
        classpath:db/h2/pilotage-direction-schema.sql,
        classpath:db/h2/facturation-schema.sql,
        classpath:db/h2/seance-schema.sql,
        classpath:db/h2/dossier-medical-schema.sql
      # Jeu(x) de données rejoués à chaque démarrage. Le profil "demo-renadial" y ajoute le jeu de test RENADIAL
      # (17 centres, 12 mois de données — voir db/demo/README.md) sans toucher au comportement par défaut.
      # SEED_DATA_LOCATIONS REMPLACE cette liste ENTIÈRE (SEED2, ADR 0188) : un script d'amorçage par contexte propriétaire
      # (contexts/<contexte>/src/main/resources/db/h2/<contexte>-seed.sql), db/seed.sql ne garde que l'identité (rôles, utilisateurs,
      # rattachements aux centres) ; le jeu dérivé multi-contextes (séances, volets, analyses, factures...) est dans le module demo-data
      # (db/demo/jeu-derive-seed.sql, ADR 0189). Ordre = dépendances de données : l'Organisation (sociétés, centres, salles, médecins,
      # créneaux) AVANT tout (app_user_center -> centers est une clé étrangère ; tout le reste référence les centres), puis comptabilité,
      # facturation, patient-couverture, db/seed.sql, jeu dérivé, enfin gmao, documents et stock (dont les lignes de sortie lisent
      # bons_sortie, créé par le jeu dérivé). Vérifié par SeedH2DesScriptsParContexteTest.
      data-locations: ${SEED_DATA_LOCATIONS:classpath:db/h2/organisation-seed.sql,classpath:db/h2/comptabilite-seed.sql,classpath:db/h2/facturation-seed.sql,classpath:db/h2/patient-couverture-seed.sql,classpath:db/seed.sql,classpath:db/demo/jeu-derive-seed.sql,classpath:db/h2/gmao-seed.sql,classpath:db/h2/documents-seed.sql,classpath:db/h2/stock-seed.sql}
  h2:
    console:
      enabled: true
      path: /h2-console
  modulith:
    events:
      jdbc:
        schema-initialization:
          # La table event_publication vient de db/schema.sql en H2 (serialized_event sans limite de 4000 caractères) et de Flyway (V35) en production.
          enabled: false
  jackson:
    time-zone: UTC
  cache:
    type: caffeine
  servlet:
    multipart:
      # Import de référentiels (CSV / Excel) : 5 Mo par fichier.
      max-file-size: 5MB
      max-request-size: 6MB

jakarta.persistence.jdbc.url: ${DB_URL:jdbc:h2:mem:hemodialyse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  dev-tools:
    # Console H2 (/h2-console) et Swagger (/swagger-ui.html) accessibles sans authentification : développement local
    # uniquement. Le profil "prod" (application-prod.yml) les désactive.
    enabled: ${DEV_TOOLS_ENABLED:true}
  setup:
    # Facultatif : si renseigné, la création du compte propriétaire exige ce jeton (installation exposée sur Internet).
    token: ${SETUP_TOKEN:}
  cache:
    ttl:
      referentials: ${CACHE_TTL_REFERENTIALS:PT6H}
      patient-detail: ${CACHE_TTL_PATIENT_DETAIL:PT15M}
      patient-list: ${CACHE_TTL_PATIENT_LIST:PT3M}
      stock-valorisation: ${CACHE_TTL_STOCK_VALORISATION:PT30M}
  cors:
    allowed-origins: ${CORS_ORIGINS:https://dialyse.onrender.com,https://dialysis-beta.vercel.app,http://localhost:4200}
    allowed-origin-patterns: ${CORS_ORIGIN_PATTERNS:}
  auth:
    cookie:
      name: ${AUTH_COOKIE_NAME:HEMO_AUTH}
      refresh-name: ${AUTH_REFRESH_COOKIE_NAME:HEMO_REFRESH}
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      path: ${AUTH_COOKIE_PATH:/}
      refresh-path: ${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth/refresh}
      domain: ${AUTH_COOKIE_DOMAIN:}
  reports:
    base-dir: ${REPORTS_DIR:}
  audit:
    # Historique conservé avant purge automatique nocturne (traçabilité "qui a fait quoi").
    retention-days: ${AUDIT_RETENTION_DAYS:365}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-123456}
    expiration: ${JWT_EXPIRATION:28800}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  planning:
    optimisation:
      # Calculs d'optimisation du planning (Timefold) exécutés en parallèle ; un seul par centre à la fois.
      workers: ${PLANNING_OPTIMISATION_WORKERS:2}
  stock:
    demo-data: ${STOCK_DEMO_DATA:true}

