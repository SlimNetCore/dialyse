# ============================================================
# Déploiement production (VM Oracle Cloud Always Free, ou tout serveur Docker)
#
#   cp env.prod.example .env      # puis éditer les secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Architecture : navigateur -> caddy (HTTPS :443) -> frontend (Nginx :80) -> backend (:8090) -> postgres
# Seuls les ports 80 et 443 (caddy) sont exposés ; frontend, backend et base restent sur le réseau interne.
# Voir infra/DEPLOIEMENT-DOMAINE.md (DNS chez amen.fr, pare-feu, HTTPS).
# ============================================================
name: hemodialyse

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hemodialyse}
      POSTGRES_USER: ${POSTGRES_USER:-hemo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port lié à la VM uniquement (127.0.0.1) : jamais exposé sur Internet. Administration à distance
    # (DBeaver, pgAdmin, psql) via tunnel SSH : voir infra/DEPLOIEMENT-DOMAINE.md, section « Base de données ».
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ internal ]

  # Migrations de schéma (one-shot) : s'exécute avant chaque démarrage du backend.
  # - base vide            -> applique V1 (schéma de référence) puis V2, V3...
  # - base existante sans historique Flyway -> baseline en V1, puis V2, V3...
  # Scripts : backend/platform/src/main/resources/db/migration
  flyway:
    image: flyway/flyway:11-alpine
    restart: "no"
    command: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hemodialyse}
      FLYWAY_USER: ${POSTGRES_USER:-hemo_user}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
      FLYWAY_CONNECT_RETRIES: "20"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_CLEAN_DISABLED: "true"
    volumes:
      - ./backend/platform/src/main/resources/db/migration:/flyway/sql:ro
    networks: [ internal ]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      PORT: 8090
      # Heap limité : adapté aux VM à faible RAM (1 Go AMD micro / 6+ Go Ampere)
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=60.0 -Djava.security.egd=file:/dev/./urandom}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hemodialyse}
      DB_USERNAME: ${POSTGRES_USER:-hemo_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DRIVER: org.postgresql.Driver
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      # Le seed par défaut utilise la syntaxe H2 ; la production conserve le schéma sans données de démo.
      SEED_DATA_LOCATIONS: ${SEED_DATA_LOCATIONS:-classpath:db/seed-production.sql}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      STOCK_DEMO_DATA: ${STOCK_DEMO_DATA:-false}
      # Front et API partagent la même origine (via Nginx) ; CORS utile seulement si domaine séparé
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # true uniquement si le site est servi en HTTPS
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      # Clés de licence persistantes (sinon clés éphémères régénérées à chaque redémarrage)
      APP_LICENSE_PUBLIC_KEY: ${APP_LICENSE_PUBLIC_KEY:-}
      APP_LICENSE_PRIVATE_KEY: ${APP_LICENSE_PRIVATE_KEY:-}
      REPORTS_DIR: /app/reports
    volumes:
      - reports_data:/app/reports
    networks: [ internal ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    networks: [ internal ]

  # Reverse proxy HTTPS : certificat Let's Encrypt obtenu et renouvelé automatiquement pour ${DOMAIN}.
  # C'est le seul service exposé sur Internet (ports 80 et 443).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN manquant dans .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant dans .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [ internal ]

volumes:
  postgres_data:
  reports_data:
  caddy_data:
  caddy_config:

networks:
  internal:
