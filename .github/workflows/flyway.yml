name: Flyway — Migrations de schéma

# Workflow réutilisable (appelé par ci.yml et deploy-vm.yml) — lançable aussi à la main.
# Vérifie, sur un PostgreSQL 16 vierge identique à la production :
#   1. qu'aucune migration déjà publiée n'a été modifiée ou supprimée (immutabilité) ;
#   2. que toute la chaîne V1..Vn s'applique proprement (migrate + validate) ;
#   3. que les entités JPA correspondent au schéma produit (Hibernate ddl-auto=validate).
on:
  workflow_call:
  workflow_dispatch:

env:
  JAVA_VERSION: "21"
  FLYWAY_IMAGE: flyway/flyway:11-alpine
  MIGRATIONS_DIR: backend/platform/src/main/resources/db/migration
  DB_NAME: hemodialyse
  DB_USER: hemo_user
  DB_PASS: hemo_pass

jobs:
  flyway:
    name: Flyway (migrate + validate + schéma JPA)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hemodialyse
          POSTGRES_USER: hemo_user
          POSTGRES_PASSWORD: hemo_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet pour comparer les migrations à la branche de base

      # ------------------------------------------------------------
      # 1. Immutabilité : une migration publiée ne se modifie jamais
      #    (sinon checksum invalide -> Flyway refuse de démarrer en prod).
      #    Seul l'archivage vers backend/db/migration-legacy est toléré.
      # ------------------------------------------------------------
      - name: Vérifier l'immutabilité des migrations existantes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            BASE="$BEFORE_SHA"
          else
            echo "Pas de référence de comparaison (nouvelle branche / lancement manuel) : contrôle ignoré."
            exit 0
          fi
          MERGE_BASE=$(git merge-base "$BASE" HEAD)
          echo "Comparaison des migrations : $MERGE_BASE -> HEAD"
          VIOLATIONS=$(git diff --name-status -M "$MERGE_BASE" HEAD \
            | awk -v dir="$MIGRATIONS_DIR/" '
                ($1 == "M" || $1 == "D") && index($2, dir) == 1 { print }
                $1 ~ /^R/ && index($2, dir) == 1 && index($3, "backend/db/migration-legacy/") != 1 { print }
              ' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Migration(s) déjà publiée(s) modifiée(s) ou supprimée(s). Créez plutôt une nouvelle migration V<n+1>__description.sql"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "OK : aucune migration existante modifiée."

      # ------------------------------------------------------------
      # 2. Chaîne complète sur base vierge
      # ------------------------------------------------------------
      - name: Flyway migrate (base vierge)
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/$MIGRATIONS_DIR:/flyway/sql:ro" \
            "$FLYWAY_IMAGE" \
            -url="jdbc:postgresql://localhost:5432/$DB_NAME" -user="$DB_USER" -password="$DB_PASS" \
            -locations=filesystem:/flyway/sql \
            -validateMigrationNaming=true \
            -connectRetries=10 \
            migrate

      - name: Flyway validate + info (idempotence)
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/$MIGRATIONS_DIR:/flyway/sql:ro" \
            "$FLYWAY_IMAGE" \
            -url="jdbc:postgresql://localhost:5432/$DB_NAME" -user="$DB_USER" -password="$DB_PASS" \
            -locations=filesystem:/flyway/sql \
            -validateMigrationNaming=true \
            validate migrate info
          echo "### Flyway" >> "$GITHUB_STEP_SUMMARY"
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/$MIGRATIONS_DIR:/flyway/sql:ro" \
            "$FLYWAY_IMAGE" \
            -url="jdbc:postgresql://localhost:5432/$DB_NAME" -user="$DB_USER" -password="$DB_PASS" \
            -locations=filesystem:/flyway/sql -outputType=json info \
            | jq -r '"Version du schéma : \(.schemaVersion)\n\n| Version | Description | État |\n|---|---|---|", (.migrations[] | "| \(.version) | \(.description) | \(.state) |")' \
            >> "$GITHUB_STEP_SUMMARY" || true

      # L'écran « Performance de la base » du propriétaire lit pg_stat_statements (PgStatStatementsAdapter). Le serveur
      # de test n'a pas la bibliothèque préchargée (la vue n'est pas lisible), mais sa définition doit exposer les
      # colonnes utilisées : un changement de version majeure de PostgreSQL qui les renommerait casse la CI ici.
      - name: Colonnes de pg_stat_statements attendues par l'application
        run: |
          COLS=$(docker run --rm --network host -e PGPASSWORD="$DB_PASS" postgres:16-alpine \
            psql -h localhost -U "$DB_USER" -d "$DB_NAME" -At -c \
            "SELECT string_agg(column_name, ',' ORDER BY column_name) FROM information_schema.columns WHERE table_name IN ('pg_stat_statements')")
          for c in dbid queryid query calls total_exec_time mean_exec_time max_exec_time rows shared_blks_hit shared_blks_read temp_blks_written; do
            case ",$COLS," in *",$c,"*) ;; *) echo "::error::colonne pg_stat_statements.$c absente"; exit 1;; esac
          done
          echo "OK : colonnes pg_stat_statements présentes"

      # Santé de la base et analyse de plan (écran du propriétaire) : les requêtes SQL de supervision, sans paramètre,
      # sont rejouées telles quelles sur un PostgreSQL réel ; la technique d'analyse (PREPARE + plan générique +
      # EXPLAIN EXECUTE) est exécutée de bout en bout sur une vraie table du schéma migré.
      - name: Requêtes de supervision et analyse de plan sur PostgreSQL
        run: |
          SQL_DIR="$GITHUB_WORKSPACE/backend/platform/src/main/resources/db/supervision"
          for f in sante-generale sante-tables sante-index-inutilises; do
            docker run --rm --network host -e PGPASSWORD="$DB_PASS" -v "$SQL_DIR:/sql:ro" postgres:16-alpine \
              psql -v ON_ERROR_STOP=1 -h localhost -U "$DB_USER" -d "$DB_NAME" -q -f "/sql/$f.sql" > /dev/null
            echo "OK : $f.sql"
          done
          PLAN=$(docker run --rm --network host -e PGPASSWORD="$DB_PASS" postgres:16-alpine \
            psql -v ON_ERROR_STOP=1 -h localhost -U "$DB_USER" -d "$DB_NAME" -At \
            -c "BEGIN READ ONLY" \
            -c "SET LOCAL plan_cache_mode = force_generic_plan" \
            -c "PREPARE sup_ci AS SELECT id FROM seances WHERE center_id = \$1 AND date_seance >= \$2" \
            -c "EXPLAIN (FORMAT JSON) EXECUTE sup_ci(NULL, NULL)" \
            -c "ROLLBACK")
          echo "$PLAN" | grep -q '"Node Type"' || { echo "::error::plan générique introuvable"; echo "$PLAN"; exit 1; }
          echo "OK : plan générique établi sans exécuter la requête"

      # L'adaptateur Java réel (connexion en lecture seule, plan générique, nettoyage de la session) sur PostgreSQL 16 :
      # le test est ignoré partout ailleurs (H2 ne sait pas le faire).
      - name: Adaptateur d'analyse de plan sur PostgreSQL
        working-directory: backend
        run: |
          ./mvnw -B -q -pl bc-seance,platform test -Dtest=PgPlanAdapterPostgresTest -Dsurefire.failIfNoSpecifiedTests=false \
            -Dpg.test.url="jdbc:postgresql://localhost:5432/$DB_NAME" -Dpg.test.user="$DB_USER" -Dpg.test.password="$DB_PASS"

      # ------------------------------------------------------------
      # 3. Cohérence entités JPA <-> schéma migré
      #    (détecte une entité modifiée sans migration associée)
      # ------------------------------------------------------------
      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build backend (sans tests)
        working-directory: backend
        run: ./mvnw -B -q -DskipTests -pl platform -am package

      # Même profil que la production (application-prod.yml) : ddl-auto=validate, ni schema.sql ni seed, console H2 et
      # Swagger fermés, garde-fou de configuration. Le schéma ne peut donc venir QUE des migrations Flyway.
      - name: Démarrer le backend avec le profil prod
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:postgresql://localhost:5432/${{ env.DB_NAME }}
          DB_USERNAME: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASS }}
          DB_DRIVER: org.postgresql.Driver
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          PORT: "8090"
        run: |
          JAR=$(ls platform/target/platform-*.jar | head -1)
          java -jar "$JAR" --server.port=8090 > backend-flyway-check.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::Le backend s'est arrêté : schéma migré incompatible avec les entités JPA"
              grep -iE "schema-validation|SchemaManagementException|APPLICATION FAILED|Caused by" backend-flyway-check.log | head -20 || tail -60 backend-flyway-check.log
              exit 1
            fi
            if curl -fsS http://localhost:8090/actuator/health >/dev/null 2>&1; then
              echo "OK : entités JPA conformes au schéma Flyway (démarrage en ${i}x3s)"
              # Les outils de développement ne doivent pas être joignables sans authentification en production.
              for path in /h2-console/ /swagger-ui.html /v3/api-docs; do
                code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8090$path")
                if [ "$code" != "401" ] && [ "$code" != "403" ] && [ "$code" != "404" ]; then
                  echo "::error::$path répond $code sans authentification avec le profil prod"
                  kill "$PID"; exit 1
                fi
              done
              echo "OK : console H2 et Swagger fermés"
              kill "$PID"; exit 0
            fi
            sleep 3
          done
          echo "::error::Le backend n'a pas démarré en 3 minutes"
          tail -80 backend-flyway-check.log
          kill "$PID" || true
          exit 1

      - name: Log backend (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-flyway-check-log
          path: backend/backend-flyway-check.log
          retention-days: 7

